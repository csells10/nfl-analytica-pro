    <!-- Pre-mount theme: prevents white flash on refresh in dark mode -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme = saved === "light" || saved === "dark" ? saved : "dark";
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(theme);
          // Match the HSL token from index.css for the chosen theme
          var bg = theme === "dark" ? "hsl(215, 18%, 9%)" : "hsl(220, 16%, 96%)";
          root.style.backgroundColor = bg;
        } catch (e) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = "hsl(215, 18%, 9%)";
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        background-color: hsl(215, 18%, 9%);
        min-height: 100%;
      }
      html.light,
      html.light body,
      html.light #root {
        background-color: hsl(220, 16%, 96%);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
